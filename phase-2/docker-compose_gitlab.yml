x-common-runner-config: &common-runner-config
  image: gitlab/gitlab-runner:v18.0.0
  restart: always
  tmpfs:
    - /tmp
    - /run
  security_opt:
    - no-new-privileges:true
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    command:
      # Enable Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cicd-network"
      # Enable file provider for dynamic config
      - "--providers.file.filename=/etc/traefik/traefik-dynamic.yml"
      - "--providers.file.watch=true"
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable API and dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Enable ping for healthcheck
      - "--ping=true"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml:ro
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gitlab:
    image: gitlab/gitlab-ce:18.3.5-ce.0
    container_name: gitlab
    restart: unless-stopped
    hostname: 'gitlab.local'
    mem_limit: 16g
    memswap_limit: 16g
    cpus: '6'
    shm_size: '2g'
    env_file:
      - .env
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.local'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }
        gitlab_rails['smtp_address'] = ENV['SMTP_HOST']
        gitlab_rails['smtp_port'] = ENV['SMTP_PORT']
        gitlab_rails['smtp_user_name'] = ENV['SMTP_USER']
        gitlab_rails['smtp_password'] = ENV['SMTP_PASSWORD']
        gitlab_rails['smtp_domain'] = ENV['SMTP_DOMAIN']
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_authentication'] = 'login'
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['gitlab_email_from'] = ENV['GITLAB_EMAIL_FROM'] || 'gitlab@local'
        prometheus_monitoring['enable'] = true
        gitlab_rails['backup_path'] = '/var/opt/gitlab/backups'
        gitlab_rails['backup_keep_time'] = 604800
      GITLAB_TIMEZONE: "Asia/Shanghai"
    ports:
      - '2222:22'
    expose:
      - "80"
    volumes:
      - 'gitlab_config:/etc/gitlab'
      - 'gitlab_logs:/var/log/gitlab'
      - 'gitlab_data:/var/opt/gitlab'
      - 'gitlab_backups:/var/opt/gitlab/backups'
    networks:
      - cicd-network
    labels:
      - "traefik.enable=true"
      # HTTP router (will redirect to HTTPS)
      - "traefik.http.routers.gitlab-http.rule=Host(`gitlab.local`)"
      - "traefik.http.routers.gitlab-http.entrypoints=web"
      # HTTPS router
      - "traefik.http.routers.gitlab-https.rule=Host(`gitlab.local`)"
      - "traefik.http.routers.gitlab-https.entrypoints=websecure"
      - "traefik.http.routers.gitlab-https.tls=true"
      - "traefik.http.routers.gitlab-https.service=gitlab"
      # Service
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/-/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gitlab-runner-docker:
    <<: *common-runner-config
    container_name: gitlab-runner-docker
    mem_limit: 2g
    cpus: '3'
    shm_size: '1g'
    depends_on:
      - gitlab                 # 👈 简单可靠
    volumes:
      - './runner-config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './certs:/certs'
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "gitlab-runner", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  gitlab-runner-shell:
    <<: *common-runner-config
    container_name: gitlab-runner-shell
    mem_limit: 8g
    cpus: '5'
    shm_size: '2g'
    depends_on:
      - gitlab                 # 👈 简单可靠
    network_mode: host
    volumes:
      - './runner-shell-config:/etc/gitlab-runner'
      - '/home/${USER:-user}:/home/${USER:-user}'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './certs:/etc/gitlab-runner/certs'
      - /dev/kvm:/dev/kvm
    group_add:
      - "104" # from the output of 'getent group kvm'
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    cap_add: []
    healthcheck:
      test: ["CMD", "gitlab-runner", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_backups:

networks:
  cicd-network:
    driver: bridge
    labels:
      project: "cicd-infra"

