# MUST define stages
stages:
  - check
  - build
  - release

# Global variables
#variables:
  # CI: "true"
  # TERM: "dumb"
  # DEBIAN_FRONTEND: "noninteractive"
  # FLUTTER_SUPPRESS_ANALYTICS: "true"
  # PUB_ENVIRONMENT: "ci"
  #
variables:
# GIT_CLONE_PATH: "http://gitlab/$CI_PROJECT_PATH.git"


# Job without tags (uses any available runner)
check-runner:
  stage: check
  script:
    - |
      echo "✅ Pipeline is running!"
      echo "Runner = $CI_RUNNER_DESCRIPTION"
      echo "Tags = $CI_RUNNER_TAGS"
      echo "User = $(whoami)"
      echo "Directory = $(pwd)"
  tags:
    - host-runner

# Check Flutter availability
check-flutter:
  stage: check
  script:
    - |
      echo "Checking Flutter installation..."
      if [ -f /usr/bin/flutter.sh ]; then
        echo "Found Flutter wrapper script"
        /usr/bin/flutter.sh doctor -v
      else
        echo "❌ Flutter not found!"
        exit 1
      fi
  tags:
    - host-runner
  allow_failure: true

# Check HEAD git commit number
check-commit-number:
  stage: check
  script:
    - |
      echo "Checking HEAD branch commit number ..."
      echo "Commit ref: $CI_COMMIT_REF_NAME"
      commit_number=$(git rev-parse HEAD)
      echo $commit_number
  tags:
    - host-runner

# Build APK
build-android:
  stage: build
  before_script:
    - |
      echo "Execution of pre-script before the real building ..."
      GRADLE_WRARPPER_PROPERTY_FILE=android/gradle/wrapper/gradle-wrapper.properties
      if [ -f $GRADLE_WRARPPER_PROPERTY_FILE ]; then
        cat $GRADLE_WRARPPER_PROPERTY_FILE 
        sed -i 's|https\\://services\.gradle\.org/distributions/\(gradle-.*-all\.zip\)|https://mirrors.cloud.tencent.com/gradle/\1|' gradle-wrapper.properties
        cat $GRADLE_WRARPPER_PROPERTY_FILE 
        echo "Using tencent mirror to avoid potential network issue ..."
      else
        echo "Failed to find $GRADLE_WRARPPER_PROPERTY_FILE in current directory ..."
      fi
  script:
    - |
      echo "Building Android APK..."
      cd $CI_PROJECT_DIR
      /usr/bin/flutter.sh pub get
      /usr/bin/flutter.sh build apk -v --release --target-platform=android-arm64,android-x64
      mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-${CI_COMMIT_SHORT_SHA}.apk
      find build -name "metadata*gz*" -type f| head -20
      echo "CI_COMMIT_TAG: "${CI_COMMIT_TAG}
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-${CI_COMMIT_SHORT_SHA}.apk
    exclude:
      - build/**/*.log
      - build/**/*.gz
      - build/**/metadata*
    untracked: false
    expire_in: 30 days
    when: on_success
  tags:
    - host-runner
  only:
    - main
    - develop

release_job:
  stage: release
  needs:
    - job: build-android
      artifacts: true
  script:
    - echo "Creating APK release for commit ${CI_COMMIT_SHA}"
  release:
    tag_name: v${CI_COMMIT_SHA}
    name: "Release $CI_COMMIT_SHA"
    description: "Flutter App Release"
    assets:
      links:
        - name: "app-${CI_COMMIT_SHORT_SHA}.apk"
          # Link to the BUILD job’s artifact using the ref (tag) and job name.
          # This works even though the release job is a different job.
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/build/app/outputs/flutter-apk/app-${CI_COMMIT_SHORT_SHA}.apk"
          link_type: "package"
  allow_failure: true
  tags:
    - host-runner
  only:
    - main
